[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pytb-hook"
version = "0.1.0"
description = "Reason-first, trimmed Python tracebacks for every Python process (auto-loaded via a .pth file)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pytb-hook = "pytb_hook.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pytb_hook"]

# Put pytb_hook.pth at the top of site-packages, where Python's `site` module runs
# it at every interpreter start-up. pip records it, so `pip uninstall` removes it.
[tool.hatch.build.targets.wheel.force-include]
"src/pytb_hook.pth" = "pytb_hook.pth"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
